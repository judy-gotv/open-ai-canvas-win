# 影策 Docker 版构建（作者：Passwd Word）
#
# 触发：Actions 页面手动运行，或 docker/、patch/ 有推送时自动构建。
# 产物：多架构镜像 ghcr.io/judy-gotv/open-ai-canvas（linux/amd64, linux/arm64, linux/arm/v7）
# 单镜像：前端已嵌入后端，一个容器同时提供 Web UI 与 /api。
# 构建顺序遵循统一规范：fresh 上游 → 拷补丁 → 打补丁 → 编译（补丁逻辑在 docker/Dockerfile 内）。
name: 构建 Docker 镜像

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 ddcat-ai/open-ai-canvas 的 commit / tag / 分支'
        required: false
        default: 'da5bff04b667b424b1463785e2d6e29413c77a98'
      image_tag:
        description: '镜像标签（默认 latest；可填如 v1.0.0）'
        required: false
        default: 'latest'
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'patch/**'
      - '.github/workflows/docker.yml'

permissions:
  contents: read
  packages: write # 推送 ghcr.io 需要

concurrency:
  group: yingce-docker-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: judy-gotv/open-ai-canvas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出打包仓库（含 docker/Dockerfile 与 patch/）
        uses: actions/checkout@v4

      - name: 检出上游源码
        uses: actions/checkout@v4
        with:
          repository: ddcat-ai/open-ai-canvas
          ref: ${{ inputs.upstream_ref || 'da5bff04b667b424b1463785e2d6e29413c77a98' }}
          path: upstream

      - name: 设置 QEMU（多架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        run: |
          cd upstream
          SHA=$(git rev-parse --short HEAD)
          TAG="${{ inputs.image_tag || 'latest' }}"
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHA}" >> $GITHUB_OUTPUT
          echo "upstream_sha=${SHA}" >> $GITHUB_OUTPUT

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.upstream_sha }}
            BUILD_COMMIT=${{ steps.meta.outputs.upstream_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
