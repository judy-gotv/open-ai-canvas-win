# 影策 Windows 便携版构建（作者：Passwd Word）
#
# 触发：Actions 页面手动运行，或推送 win-v* 标签自动发版。
# 实际构建逻辑在 build-core.yml（复用），本文件只是薄封装。
# 定时自动跟踪上游见 auto-update.yml。
name: 构建 Windows 便携版

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 ddcat-ai/open-ai-canvas 的 commit / tag / 分支'
        required: false
        default: 'dc035d51311925e48ab1542df094bd1e2b07ba7f'
      release_tag:
        description: '发版标签（如 win-v0.1.7）；为空则只构建不发版'
        required: false
        default: ''
  push:
    tags:
      - 'win-v*'

permissions:
  contents: write  # 发 Release 需要

concurrency:
  group: winportable-build
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-core.yml
    with:
      upstream_ref: ${{ inputs.upstream_ref || 'dc035d51311925e48ab1542df094bd1e2b07ba7f' }}
      # 标签推送时发版（release_tag=标签名）；手动运行时按输入决定是否发版
      release_tag: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}
